<!DOCTYPE html>
<html lang='en'>
<head>
<meta charset='UTF-8'>
<title>6 Tables</title>
</head>
<body>

    <div>
        <table border="1" cellpadding="5" cellspacing="0" summary="Employee Status Directory">
            <caption>Employee Directory</caption>
            <thead>
                <tr>
                    <th scope="col">ID</th>
                    <th scope="col">Name</th>
                    <th scope="col">Role</th>
                    <th scope="col">Status</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td>101</td>
                    <td>Alice Johnson</td>
                    <td>Frontend Developer</td>
                    <td>Active</td>
                </tr>
                <tr>
                    <td>102</td>
                    <td>Bob Smith</td>
                    <td>Backend Developer</td>
                    <td>Offline</td>
                </tr>
            </tbody>
            <tfoot>
                <tr>
                    <td colspan="4">Total Employees: 2</td>
                </tr>
            </tfoot>
        </table>
    </div>
    
</body>
</html>
