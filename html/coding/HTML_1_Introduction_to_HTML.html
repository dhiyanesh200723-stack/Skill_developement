<!DOCTYPE html>
<html lang='en'>
<head>
<meta charset='UTF-8'>
<title>1 Introduction to HTML</title>
</head>
<body>

    <header>
        <h1>Introduction to HTML5</h1>
        <p>The standard markup language for documents designed to be displayed in a web browser.</p>
    </header>
    <main>
        <article>
            <h2>Semantic HTML</h2>
            <p>Intermediate HTML focuses on semantics. We use tags like &lt;header&gt;, &lt;main&gt;, &lt;article&gt;, and &lt;section&gt; instead of just &lt;div&gt;.</p>
        </article>
    </main>
    
</body>
</html>
