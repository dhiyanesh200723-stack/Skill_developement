<!DOCTYPE html>
<html lang='en'>
<head>
<meta charset='UTF-8'>
<title>2 Paragraph Anchor tag Heading</title>
</head>
<body>

    <div>
        <h1>Main Document Heading (H1)</h1>
        <h2>Subheading (H2)</h2>
        <p>This paragraph contains a mix of text and inline elements. For example, an <a href='https://www.w3schools.com/html/' target='_blank' rel='noopener noreferrer'>external link to HTML documentation</a> that opens in a new tab securely using the `rel` attribute.</p>
    </div>
    
</body>
</html>
