<!DOCTYPE html>
<html lang='en'>
<head>
<meta charset='UTF-8'>
<title>10 Overall Webpage Design Task 3</title>
</head>
<body>

    <div>
        <header>
            <h1>The Overall HTML Design Task</h1>
            <p>Combining all elements semantically.</p>
        </header>
        
        <nav>
            <a href="#section1">Section 1</a> | 
            <a href="#section2">Section 2</a>
        </nav>
        <hr>
        
        <main>
            <section id="section1">
                <h2>Feature 1: Media</h2>
                <figure>
                    <img src="https://via.placeholder.com/150" alt="Placeholder">
                    <figcaption>Placeholder Image</figcaption>
                </figure>
                <p>This section uses <strong>strong</strong> and <em>emphasized</em> text.</p>
            </section>
            
            <hr>
            
            <section id="section2">
                <h2>Feature 2: Tabular Data</h2>
                <table border="1">
                    <tr><th>Header 1</th><th>Header 2</th></tr>
                    <tr><td>Data 1</td><td>Data 2</td></tr>
                </table>
            </section>
            
            <hr>
            
            <section id="section3">
                <h2>Feature 3: User Input</h2>
                <form>
                    <label for="feedback">Leave Feedback:</label><br>
                    <textarea id="feedback" name="feedback" rows="4" cols="50" placeholder="Type here..."></textarea><br>
                    <button type="submit">Submit Feedback</button>
                </form>
            </section>
        </main>
        
        <hr>
        <footer>
            <address>
                Written by <a href="mailto:webmaster@example.com">Webmaster</a>.<br> 
                Visit us at: Box 564, Disneyland<br>
                USA
            </address>
        </footer>
    </div>
    
</body>
</html>
