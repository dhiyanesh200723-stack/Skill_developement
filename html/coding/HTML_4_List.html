<!DOCTYPE html>
<html lang='en'>
<head>
<meta charset='UTF-8'>
<title>4 List</title>
</head>
<body>

    <div>
        <h2>Nested and Semantic Lists</h2>
        <ol type="I">
            <li>Frontend Technologies
                <ul type="square">
                    <li>HTML5 (Structure)</li>
                    <li>CSS3 (Styling)</li>
                    <li>JavaScript (Behavior)</li>
                </ul>
            </li>
            <li>Backend Technologies
                <ul type="circle">
                    <li>Python / Django</li>
                    <li>Node.js</li>
                </ul>
            </li>
        </ol>
        <dl>
            <dt>HTML</dt>
            <dd>HyperText Markup Language</dd>
            <dt>HTTP</dt>
            <dd>HyperText Transfer Protocol</dd>
        </dl>
    </div>
    
</body>
</html>
