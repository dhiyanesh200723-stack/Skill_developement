<!DOCTYPE html>
<html lang="en" ng-app="calculatorApp">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Premium AngularJS Calculator</title>
    <meta name="description" content="A sleek, modern calculator built with AngularJS and pure CSS.">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <script src="https://ajax.googleapis.com/ajax/libs/angularjs/1.8.2/angular.min.js"></script>
    <script src="app.js"></script>
</head>
<body ng-controller="CalculatorController as calc">
    <div class="calculator-container">
        <div class="calculator">
            <div class="display">
                <div class="previous-operand" id="previous-operand">{{ calc.previousOperand }} <span ng-if="calc.operation === '*'">×</span><span ng-if="calc.operation === '/'">÷</span><span ng-if="calc.operation === '+'">+</span><span ng-if="calc.operation === '-'">−</span></div>
                <div class="current-operand" id="current-operand">{{ calc.currentOperand || '0' }}</div>
            </div>
            <div class="buttons">
                <button class="btn clear" id="btn-clear" ng-click="calc.clear()">AC</button>
                <button class="btn delete" id="btn-delete" ng-click="calc.delete()">DEL</button>
                <button class="btn operator" id="btn-divide" ng-click="calc.chooseOperation('/')">÷</button>
                
                <button class="btn number" id="btn-7" ng-click="calc.appendNumber('7')">7</button>
                <button class="btn number" id="btn-8" ng-click="calc.appendNumber('8')">8</button>
                <button class="btn number" id="btn-9" ng-click="calc.appendNumber('9')">9</button>
                <button class="btn operator" id="btn-multiply" ng-click="calc.chooseOperation('*')">×</button>
                
                <button class="btn number" id="btn-4" ng-click="calc.appendNumber('4')">4</button>
                <button class="btn number" id="btn-5" ng-click="calc.appendNumber('5')">5</button>
                <button class="btn number" id="btn-6" ng-click="calc.appendNumber('6')">6</button>
                <button class="btn operator" id="btn-subtract" ng-click="calc.chooseOperation('-')">−</button>
                
                <button class="btn number" id="btn-1" ng-click="calc.appendNumber('1')">1</button>
                <button class="btn number" id="btn-2" ng-click="calc.appendNumber('2')">2</button>
                <button class="btn number" id="btn-3" ng-click="calc.appendNumber('3')">3</button>
                <button class="btn operator" id="btn-add" ng-click="calc.chooseOperation('+')">+</button>
                
                <button class="btn number zero" id="btn-0" ng-click="calc.appendNumber('0')">0</button>
                <button class="btn number" id="btn-dot" ng-click="calc.appendNumber('.')">.</button>
                <button class="btn equals" id="btn-equals" ng-click="calc.compute()">=</button>
            </div>
        </div>
    </div>
</body>
</html>
