<!DOCTYPE html>
<html lang='en'>
<head>
<meta charset='UTF-8'>
<title>7 Layout</title>
</head>
<body>

    <style>
        body { font-family: sans-serif; margin: 0; padding: 20px; background: #f0f2f5; }
        /* CSS Grid Layout */
        .grid-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            max-width: 1200px;
            margin: 0 auto;
        }
        .card {
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            transition: transform 0.3s;
        }
        .card:hover { transform: translateY(-5px); }
    </style>
    <div class='grid-container'>
        <div class='card'><h3>Grid Item 1</h3><p>Responsive layout using Grid auto-fit and minmax.</p></div>
        <div class='card'><h3>Grid Item 2</h3><p>Adapts perfectly to screen width.</p></div>
        <div class='card'><h3>Grid Item 3</h3><p>No media queries needed for this basic responsiveness!</p></div>
    </div>
    
</body>
</html>
