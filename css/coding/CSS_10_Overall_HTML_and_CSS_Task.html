<!DOCTYPE html>
<html lang='en'>
<head>
<meta charset='UTF-8'>
<title>10 Overall HTML and CSS Task</title>
</head>
<body>

    <style>
        :root { --p: #6c5ce7; --bg: #f5f6fa; --t: #2d3436; }
        * { box-sizing: border-box; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); color: var(--t); margin: 0; padding: 0; }
        
        .dashboard { display: grid; grid-template-columns: 250px 1fr; min-height: 100vh; }
        
        .sidebar { background: white; padding: 30px 20px; box-shadow: 2px 0 10px rgba(0,0,0,0.05); }
        .sidebar h2 { color: var(--p); display: flex; align-items: center; gap: 10px; }
        .sidebar ul { list-style: none; padding: 0; margin-top: 30px; }
        .sidebar li { padding: 12px 15px; margin-bottom: 10px; border-radius: 8px; cursor: pointer; transition: 0.3s; }
        .sidebar li:hover, .sidebar li.active { background: rgba(108, 92, 231, 0.1); color: var(--p); font-weight: bold; }
        
        .main-content { padding: 40px; overflow-y: auto; }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 40px; }
        
        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; margin-bottom: 40px; }
        .stat-card { background: white; padding: 25px; border-radius: 15px; box-shadow: 0 5px 15px rgba(0,0,0,0.05); border-top: 4px solid var(--p); transition: transform 0.3s; }
        .stat-card:hover { transform: translateY(-5px); }
        .stat-card h3 { font-size: 0.9rem; color: #a4b0be; margin-top: 0; }
        .stat-card .value { font-size: 2rem; font-weight: bold; margin: 10px 0 0 0; }
        
        .recent-activity { background: white; border-radius: 15px; padding: 25px; box-shadow: 0 5px 15px rgba(0,0,0,0.05); }
    </style>
    
    <div class="dashboard">
        <aside class="sidebar">
            <h2><span style="font-size: 24px;">❖</span> AppAdmin</h2>
            <ul>
                <li class="active">Overview</li>
                <li>Analytics</li>
                <li>Settings</li>
            </ul>
        </aside>
        
        <main class="main-content">
            <header class="header">
                <div>
                    <h1 style="margin:0;">Welcome back, User</h1>
                    <p style="color:#7f8fa6; margin: 5px 0 0 0;">Here's what's happening today.</p>
                </div>
                <div style="width: 40px; height: 40px; border-radius: 50%; background: var(--p); color: white; display: flex; align-items: center; justify-content: center; font-weight: bold;">U</div>
            </header>
            
            <div class="stats-grid">
                <div class="stat-card"><h3>TOTAL USERS</h3><p class="value">14,205</p></div>
                <div class="stat-card" style="border-top-color: #00b894;"><h3>REVENUE</h3><p class="value">$45,210</p></div>
                <div class="stat-card" style="border-top-color: #fdcb6e;"><h3>ACTIVE SESSIONS</h3><p class="value">1,342</p></div>
            </div>
            
            <div class="recent-activity">
                <h2>Recent Activity</h2>
                <p>Advanced layout combining Grid, Flexbox, custom properties, and modern UI trends.</p>
            </div>
        </main>
    </div>
    
</body>
</html>
