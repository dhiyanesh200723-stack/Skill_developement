<!DOCTYPE html>
<html lang='en'>
<head>
<meta charset='UTF-8'>
<title>5 CSS Text and Font</title>
</head>
<body>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;1,400&family=Roboto:wght@300;400&display=swap');
        body { background: #fdfbfb; padding: 40px; }
        .typography-demo { max-width: 600px; margin: auto; }
        h1 { font-family: 'Playfair Display', serif; font-size: 3rem; color: #2c3e50; letter-spacing: -1px; margin-bottom: 10px; line-height: 1.1; }
        .subtitle { font-family: 'Playfair Display', serif; font-style: italic; color: #7f8c8d; font-size: 1.2rem; margin-bottom: 30px; border-bottom: 1px solid #eee; padding-bottom: 20px; }
        p { font-family: 'Roboto', sans-serif; font-size: 1.1rem; line-height: 1.8; color: #444; text-align: justify; }
    </style>
    <div class='typography-demo'>
        <h1>Advanced Typography</h1>
        <div class='subtitle'>Importing Google Fonts and using rem units</div>
        <p>By pairing a serif font like Playfair Display for headings with a clean sans-serif like Roboto for body text, we create a highly readable, elegant reading experience. Line-height, letter-spacing, and text-alignment play crucial roles.</p>
    </div>
    
</body>
</html>
