<!DOCTYPE html>
<html lang='en'>

<title>3 CSS Comments</title>
</head>
<body>

    <style>
        /* 
         * Theme Configuration
         * Defines the primary color palette for the component.
         */
        .alert {
            padding: 15px 20px;
            background-color: #d4edda; /* Light green background */
            color: #155724;            /* Dark green text */
            border: 1px solid #c3e6cb;
            border-radius: 4px;
            font-family: sans-serif;
        }
    </style>
    <div class='alert'>
        <strong>Success!</strong> Multi-line block comments and inline comments used in the stylesheet.
    </div>
